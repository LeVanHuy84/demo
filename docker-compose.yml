services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: seminar-jenkins
    restart: unless-stopped
    user: root
    ports:
      - '8080:8080'
      - '50000:50000'
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

      # 🔥 QUAN TRỌNG: mount project local vào container
      - D:/VsCode/Seminar/demo:/workspace/demo

volumes:
  jenkins_home:
